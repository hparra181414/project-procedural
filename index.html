<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Procedural</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Project Procedural</h1>

  <!-- This form logs one "string" - one timed run of one drill -->
  <form id="string-form">
    <label for="drill-name">Drill</label>
    <input type="text" id="drill-name" placeholder="e.g. Bill Drill" required>

    <label for="time-seconds">Time (seconds)</label>
    <input type="number" step="0.01" id="time-seconds" placeholder="e.g. 2.45" required>

    <label>Hits</label>
    <div class="hits-row">
      <div class="hit-box">
        <span class="hit-label">A</span>
        <input type="number" id="hits-a" min="0" value="0">
      </div>
      <div class="hit-box">
        <span class="hit-label">C</span>
        <input type="number" id="hits-c" min="0" value="0">
      </div>
      <div class="hit-box">
        <span class="hit-label">D</span>
        <input type="number" id="hits-d" min="0" value="0">
      </div>
      <div class="hit-box">
        <span class="hit-label">M</span>
        <input type="number" id="hits-m" min="0" value="0">
      </div>
      <div class="hit-box">
        <span class="hit-label">NS</span>
        <input type="number" id="hits-ns" min="0" value="0">
      </div>
    </div>

    <button type="submit">Log String</button>
  </form>

  <h2>Today's Log</h2>
  <ul id="string-list">
    <!-- Logged strings will appear here, added by app.js -->
  </ul>

  <script src="app.js"></script>
</body>
</html>
