<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Procedural</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Project Procedural</h1>

  <!-- View 1: shown when there's no active session -->
  <section id="session-start-view">
    <button id="start-session-btn">Start New Session</button>
    <button id="view-history-btn" class="secondary">View Past Sessions</button>
    <button id="view-prs-btn" class="secondary">Personal Records</button>
    <button id="view-drill-library-btn" class="secondary">Drill Library</button>

    <div class="backup-section">
      <p class="backup-label">Backup (your data lives only on this device)</p>
      <button id="export-data-btn" class="secondary">Export Backup</button>
      <button id="import-data-btn" class="secondary">Import Backup</button>
      <input type="file" id="import-file-input" accept="application/json" class="hidden">
    </div>
  </section>

  <!-- View 6: drill library - view and edit saved drills -->
  <section id="drill-library-view" class="hidden">
    <button id="back-from-drill-library-btn" class="secondary">&larr; Back</button>
    <h2>Drill Library</h2>
    <div id="drill-library-list"></div>
  </section>

  <!-- View 3: session history list -->
  <section id="history-view" class="hidden">
    <button id="back-from-history-btn" class="secondary">&larr; Back</button>
    <h2>Past Sessions</h2>
    <div id="history-list"></div>
  </section>

  <!-- View 4: personal records -->
  <section id="pr-view" class="hidden">
    <button id="back-from-pr-btn" class="secondary">&larr; Back</button>
    <h2>Personal Records</h2>
    <div id="pr-list"></div>
  </section>

  <!-- View 5: viewing/editing a past session -->
  <section id="history-detail-view" class="hidden">
    <button id="back-from-history-detail-btn" class="secondary">&larr; Back to History</button>
    <div class="session-meta">
      <input type="text" id="history-detail-name" placeholder="Session Name">
      <p class="history-detail-date" id="history-detail-date"></p>
    </div>
    <div id="history-detail-drill-entries"></div>
  </section>

  <!-- View 2: shown while a session is in progress -->
  <section id="active-session-view" class="hidden">
    <div class="session-meta">
      <input type="text" id="session-name" placeholder="Session Name (e.g. Draw & Movement Day)">
    </div>

    <div class="session-stats-bar">
      <span id="session-timer">00:00</span>
      <span id="session-rounds">0 rounds fired</span>
    </div>

    <!-- Drill sections get built dynamically here by app.js -->
    <div id="drill-entries"></div>

    <div class="add-drill">
      <input type="text" id="add-drill-input" list="drill-options" placeholder="Add a drill (e.g. Bill Drill)">
      <datalist id="drill-options"></datalist>
      <button id="add-drill-btn">Add Drill</button>
    </div>

    <!-- Shown only when the typed drill name doesn't exist yet -->
    <div id="new-drill-setup" class="hidden new-drill-setup">
      <h4>New drill: <span id="new-drill-name-display"></span></h4>

      <label>Discipline</label>
      <select id="new-drill-discipline">
        <option value="pistol">Pistol</option>
        <option value="rifle">Rifle</option>
      </select>

      <label>Scoring Type</label>
      <select id="new-drill-scoring-type">
        <option value="uspsa_zones">USPSA Zones (A/C/D/M/NS)</option>
        <option value="hit_miss">Hits vs Misses</option>
        <option value="time_only">Time Only</option>
      </select>

      <div id="new-drill-power-factor-row">
        <label>Power Factor</label>
        <select id="new-drill-power-factor">
          <option value="minor" selected>Minor</option>
          <option value="major">Major</option>
        </select>
      </div>

      <label>Round Count</label>
      <input type="number" id="new-drill-round-count" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 6">

      <label>Target Count</label>
      <input type="number" id="new-drill-target-count" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 1">

      <label>Par Time (optional, seconds)</label>
      <input type="number" step="0.01" inputmode="decimal" id="new-drill-par-time" placeholder="optional">

      <button id="confirm-new-drill-btn">Save & Add to Session</button>
      <button id="cancel-new-drill-btn" class="secondary">Cancel</button>
    </div>

    <button id="end-session-btn" class="secondary">End Session</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
